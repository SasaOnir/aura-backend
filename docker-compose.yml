# Aura — infrastruttura locale di sviluppo (Docker Compose)
# Avvia tutto con:  docker compose up -d
# Logs:             docker compose logs -f backend
# Reset DB:         docker compose down -v && docker compose up -d
#
# Servizi:
#   db        PostgreSQL 16     :5432
#   redis     Redis 7          :6379
#   minio     S3-compatibile   :9000  (console :9001)
#   backend   NestJS API       :4000
#   frontend  Next.js app      :3000

# SICUREZZA: nessun segreto ha un valore di default. Se manca una variabile
# obbligatoria, `docker compose up` si ferma (sintassi ${VAR:?messaggio}).
# Le porte dei servizi interni sono legate a 127.0.0.1: non raggiungibili da Internet.

services:
  db:
    image: postgres:16-alpine
    container_name: aura_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aura_db_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db/hardening.sql:/docker-entrypoint-initdb.d/02_hardening.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aura_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?imposta REDIS_PASSWORD in .env}"]
    volumes:
      - aura_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: aura_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?imposta S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY in .env}
    command: server /data --console-address ":9001"
    volumes:
      - aura_minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-aura}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?genera con openssl rand -base64 64}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?genera con openssl rand -base64 64}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      AURA_SUPERADMIN_EMAIL: ${AURA_SUPERADMIN_EMAIL:?}
      AURA_SUPERADMIN_PASSWORD: ${AURA_SUPERADMIN_PASSWORD:?}
      AURA_SUPERADMIN_NAME: ${AURA_SUPERADMIN_NAME:-Proprietario Aura}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      APP_ORIGIN: ${APP_ORIGIN:?}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?genera con openssl rand -base64 32}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-aura-audio}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_FORCE_PATH_STYLE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL pubblico del backend visto dal BROWSER (incorporato nel bundle e nella CSP)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: aura_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Rete interna: il BFF del frontend parla col backend senza passare da Internet
      BACKEND_URL: http://backend:4000
      # Origine pubblica del sito: il BFF accetta POST di autenticazione solo da qui (anti-CSRF)
      APP_ORIGIN: ${APP_ORIGIN:?imposta APP_ORIGIN in .env (es. https://aura.example.org)}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  aura_db_data:
  aura_redis_data:
  aura_minio_data:
